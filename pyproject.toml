[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".venv", ".venv313"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "FAST"]
ignore = ["FAST001", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"